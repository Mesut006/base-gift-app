<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BaseGift | On-Chain Hediye</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: radial-gradient(circle at top right, #1e40af, #000); min-height: 100vh; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .btn-primary { background: linear-gradient(45deg, #3b82f6, #2563eb); transition: all 0.3s ease; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(37, 99, 235, 0.3); }
    </style>
</head>
<body class="text-gray-100 p-4 md:p-12">
    <div class="max-w-2xl mx-auto">
        <div class="flex justify-between items-center mb-12">
            <h1 class="text-3xl font-800 tracking-tighter italic">BASE<span class="text-blue-500">GIFT</span></h1>
            <button id="connectBtn" class="glass px-6 py-2 rounded-full text-sm font-semibold hover:bg-white/10 transition">Cüzdanı Bağla</button>
        </div>

        <div class="grid md:grid-cols-2 gap-8">
            <div class="glass p-8 rounded-3xl">
                <div class="mb-6">
                    <h2 class="text-xl font-bold mb-1">Hediye Gönder 🎁</h2>
                    <p class="text-gray-400 text-sm">Şifreli bir paket oluştur.</p>
                </div>
                <div class="space-y-4">
                    <input id="amount" type="number" placeholder="Miktar (ETH)" class="w-full bg-white/5 border border-white/10 p-3 rounded-xl outline-none focus:border-blue-500">
                    <input id="createPass" type="password" placeholder="Gizli Şifre" class="w-full bg-white/5 border border-white/10 p-3 rounded-xl outline-none focus:border-blue-500">
                    <button onclick="createGift()" class="w-full btn-primary py-4 rounded-xl font-bold">Paketi Mühürle</button>
                </div>
            </div>

            <div class="glass p-8 rounded-3xl">
                <div class="mb-6">
                    <h2 class="text-xl font-bold mb-1">Hediye Al 🔑</h2>
                    <p class="text-gray-400 text-sm">Sana gelen şifreyi çöz.</p>
                </div>
                <div class="space-y-4">
                    <input id="giftId" type="number" placeholder="Hediye ID" class="w-full bg-white/5 border border-white/10 p-3 rounded-xl outline-none focus:border-blue-500">
                    <input id="claimPass" type="password" placeholder="Şifreyi Gir" class="w-full bg-white/5 border border-white/10 p-3 rounded-xl outline-none focus:border-blue-500">
                    <button onclick="claimGift()" class="w-full bg-white/10 border border-white/20 py-4 rounded-xl font-bold hover:bg-white/20">Parayı Çek</button>
                </div>
            </div>
        </div>

        <div id="statusBox" class="mt-8 glass p-6 rounded-2xl hidden text-center animate-pulse">
            <p id="status" class="text-blue-300 font-mono text-sm"></p>
            <div id="shareArea" class="mt-4 hidden border-t border-white/10 pt-4">
                <p class="text-xs text-gray-500 mb-2 uppercase tracking-widest">Hediye Linkin:</p>
                <div class="flex gap-2">
                    <input id="shareUrl" readonly class="w-full bg-black/30 p-2 rounded text-xs outline-none">
                    <button onclick="copyLink()" class="bg-blue-600 px-4 rounded text-xs font-bold">Kopyala</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const contractAddress = "0xAC49eABbCE2e58BFE8a517F523fF987a6227b5aD";
        const abi = [
            {"inputs":[{"internalType":"bytes32","name":"_sifreHash","type":"bytes32"}],"name":"hediyeOlustur","outputs":[],"stateMutability":"payable","type":"function"},
            {"inputs":[{"internalType":"uint256","name":"_id","type":"uint256"},{"internalType":"string","name":"_sifre","type":"string"}],"name":"hediyeAl","outputs":[],"stateMutability":"nonpayable","type":"function"},
            {"inputs":[],"name":"hediyeSayaci","outputs":[{"internalType":"uint256","name":"","type":"uint256"}],"stateMutability":"view","type":"function"}
        ];

        let signer, contract;

        window.onload = () => {
            const urlParams = new URLSearchParams(window.location.search);
            if(urlParams.get('id')) document.getElementById('giftId').value = urlParams.get('id');
        };

        document.getElementById('connectBtn').onclick = async () => {
            try {
                const provider = new ethers.BrowserProvider(window.ethereum);
                await provider.send("eth_requestAccounts", []);
                signer = await provider.getSigner();
                contract = new ethers.Contract(contractAddress, abi, signer);
                document.getElementById('connectBtn').innerText = "Cüzdan Bağlı";
                showStatus("Cüzdan bağlandı, işleme hazır.");
            } catch (err) {
                showStatus("Bağlantı Hatası: " + err.message);
            }
        };

        async function createGift() {
            try {
                const amt = document.getElementById('amount').value;
                const pass = document.getElementById('createPass').value;
                if(!signer) return showStatus("Önce cüzdanı bağlayın!");
                
                const hash = ethers.keccak256(ethers.toUtf8Bytes(pass));
                showStatus("MetaMask onayı bekleniyor...");
                const tx = await contract.hediyeOlustur(hash, { 
                    value: ethers.parseEther(amt),
                    gasLimit: 200000 
                });
                
                showStatus("Onaylanıyor...");
                await tx.wait();
                
                const count = await contract.hediyeSayaci();
                const id = Number(count) - 1;
                showStatus(`✅ Başarılı! ID: ${id}`);
                showShareLink(id);
            } catch (e) {
                showStatus("Hata: " + (e.reason || e.message));
            }
        }

        async function claimGift() {
            try {
                const id = document.getElementById('giftId').value;
                const pass = document.getElementById('claimPass').value;
                if(!signer) return showStatus("Önce cüzdanı bağlayın!");

                showStatus("Kontrol ediliyor...");
                const tx = await contract.hediyeAl(BigInt(id), pass);
                await tx.wait();
                showStatus("🎉 Para cüzdanınıza aktarıldı!");
            } catch (e) {
                showStatus("Hata: " + (e.reason || "Şifre yanlış olabilir."));
            }
        }

        function showStatus(msg) {
            const box = document.getElementById('statusBox');
            box.classList.remove('hidden');
            document.getElementById('status').innerText = msg;
        }

        function showShareLink(id) {
            const area = document.getElementById('shareArea');
            area.classList.remove('hidden');
            const url = window.location.origin + window.location.pathname + "?id=" + id;
            document.getElementById('shareUrl').value = url;
        }

        function copyLink() {
            const copyText = document.getElementById('shareUrl');
            copyText.select();
            document.execCommand("copy");
            alert("Link kopyalandı!");
        }
    </script>
</body>
</html>
