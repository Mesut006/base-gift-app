<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base Hediye Kartı</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0052FF; background-image: radial-gradient(circle at top right, #0052FF, #000000); min-height: 100vh; color: white; }
        .glass { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 20px; }
    </style>
</head>
<body class="p-4 md:p-8 font-sans">
    <div class="max-w-md mx-auto">
        <div class="text-center mb-10">
            <h1 class="text-4xl font-bold mb-2 tracking-tight">Base Gift</h1>
            <p class="opacity-80">Onchain Hediye Kartı Oluştur</p>
        </div>

        <button id="connectButton" class="w-full py-4 px-6 mb-6 font-bold text-lg bg-white text-blue-600 rounded-2xl shadow-xl hover:scale-105 transition-transform">
            Cüzdanı Bağla
        </button>

        <div class="glass p-6 mb-6">
            <h2 class="text-xl font-bold mb-4 flex items-center">🎁 Hediye Gönder</h2>
            <input id="amount" type="number" placeholder="Miktar (ETH)" class="w-full p-3 mb-3 rounded-xl bg-black/20 border border-white/20 text-white outline-none">
            <input id="createPassword" type="password" placeholder="Hediye Şifresi Belirle" class="w-full p-3 mb-4 rounded-xl bg-black/20 border border-white/20 text-white outline-none">
            <button id="createButton" class="w-full py-3 bg-green-500 hover:bg-green-600 rounded-xl font-bold transition-colors">Hediye Paketi Yap</button>
        </div>

        <div class="glass p-6">
            <h2 class="text-xl font-bold mb-4 flex items-center">🔓 Hediyeyi Aç</h2>
            <input id="giftId" type="number" placeholder="Hediye ID (Örn: 0)" class="w-full p-3 mb-3 rounded-xl bg-black/20 border border-white/20 text-white outline-none">
            <input id="claimPassword" type="password" placeholder="Şifreyi Girin" class="w-full p-3 mb-4 rounded-xl bg-black/20 border border-white/20 text-white outline-none">
            <button id="claimButton" class="w-full py-3 bg-white/20 hover:bg-white/30 rounded-xl font-bold transition-colors">Parayı Cüzdana Çek</button>
        </div>

        <div id="status" class="mt-6 text-center text-sm opacity-70"></div>
    </div>

    <script>
        const contractAddress = "0xeb48BAE3B57521FFd300Ce7E9fd159b369CCDa3d";
        const abi = [
            "function hediyeOlustur(bytes32 _sifreHash) public payable",
            "function hediyeAl(uint256 _id, string memory _sifre) public",
            "function hediyeSayaci() public view returns (uint256)"
        ];

        let provider, signer, contract;

        async function init() {
            if (window.ethereum) {
                provider = new ethers.BrowserProvider(window.ethereum);
                document.getElementById('connectButton').addEventListener('click', connect);
                document.getElementById('createButton').addEventListener('click', createGift);
                document.getElementById('claimButton').addEventListener('click', claimGift);
            } else {
                alert("Lütfen MetaMask yükleyin!");
            }
        }

        async function connect() {
            signer = await provider.getSigner();
            contract = new ethers.Contract(contractAddress, abi, signer);
            document.getElementById('connectButton').innerText = "Cüzdan Bağlandı ✅";
            document.getElementById('connectButton').classList.replace('bg-white', 'bg-green-100');
        }

        async function createGift() {
            try {
                const amount = document.getElementById('amount').value;
                const password = document.getElementById('createPassword').value;
                const hash = ethers.keccak256(ethers.toUtf8Bytes(password));
                
                document.getElementById('status').innerText = "İşlem onaylanıyor...";
                const tx = await contract.hediyeOlustur(hash, { value: ethers.parseEther(amount) });
                await tx.wait();
                document.getElementById('status').innerText = "Hediye başarıyla oluşturuldu! Arkadaşınıza ID ve şifreyi gönderin.";
            } catch (err) {
                console.error(err);
                document.getElementById('status').innerText = "Hata oluştu. Detaylar konsolda.";
            }
        }

        async function claimGift() {
            try {
                const id = document.getElementById('giftId').value;
                const password = document.getElementById('claimPassword').value;
                
                document.getElementById('status').innerText = "Hediye açılıyor...";
                const tx = await contract.hediyeAl(id, password);
                await tx.wait();
                document.getElementById('status').innerText = "Başarılı! ETH cüzdanınıza aktarıldı.";
            } catch (err) {
                alert("Hata: Şifre yanlış olabilir veya hediye zaten alınmış.");
            }
        }

        init();
    </script>
</body>
</html>
