<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BaseGift | On-Chain</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@web3modal/ethers@5.1.5/dist/index.umd.js"></script>
    
    <style>
        body { background: #050a18; color: white; font-family: sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; }
    </style>
</head>
<body class="p-6">
    <div class="max-w-md mx-auto space-y-6">
        <div class="flex justify-between items-center py-4">
            <h1 class="text-xl font-bold italic uppercase tracking-tighter">BASE<span class="text-blue-500">GIFT</span></h1>
            <button onclick="openWalletModal()" id="mainConnectBtn" class="bg-blue-600 hover:bg-blue-700 px-6 py-2 rounded-full font-bold text-sm transition-all active:scale-95">Cüzdanı Bağla</button>
        </div>

        <div class="glass p-6 space-y-4">
            <h2 class="text-lg font-bold">Hediye Gönder 🎁</h2>
            <input id="amount" type="number" step="0.01" placeholder="Miktar (ETH)" class="w-full bg-black/20 p-3 rounded-xl border border-white/10 outline-none">
            <input id="createPass" type="password" placeholder="Gizli Şifre" class="w-full bg-black/20 p-3 rounded-xl border border-white/10 outline-none">
            <button onclick="createGift()" id="sendBtn" class="w-full bg-blue-500 hover:bg-blue-600 py-3 rounded-xl font-bold transition-colors">Paketi Mühürle</button>
        </div>

        <div class="glass p-6 space-y-4">
            <h2 class="text-lg font-bold">Hediye Al 🔑</h2>
            <input id="giftId" type="number" placeholder="Hediye ID" class="w-full bg-black/20 p-3 rounded-xl border border-white/10 outline-none">
            <input id="claimPass" type="password" placeholder="Şifreyi Gir" class="w-full bg-black/20 p-3 rounded-xl border border-white/10 outline-none">
            <button onclick="claimGift()" id="receiveBtn" class="w-full bg-white/10 hover:bg-white/20 py-3 rounded-xl font-bold transition-colors">Parayı Çek</button>
        </div>
        
        <p id="statusLabel" class="text-center text-xs text-blue-400 font-mono italic"></p>
    </div>

    <script>
        const contractAddress = "0x40528Fa18B169724789D756218cE0652018ada33";
        const abi = [{"inputs":[{"internalType":"bytes32","name":"_sifreHash","type":"bytes32"}],"name":"hediyeOlustur","outputs":[],"stateMutability":"payable","type":"function"},{"inputs":[{"internalType":"uint256","name":"_id","type":"uint256"},{"internalType":"string","name":"_sifre","type":"string"}],"name":"hediyeAl","outputs":[],"stateMutability":"nonpayable","type":"function"},{"inputs":[{"internalType":"address","name":"_olusturan","type":"address"}],"name":"kullaniciHediyeleri","outputs":[{"internalType":"uint256[]","name":"","type":"uint256[]"}],"stateMutability":"view","type":"function"},{"inputs":[{"internalType":"uint256","name":"","type":"uint256"}],"name":"hediyeler","outputs":[{"internalType":"address","name":"olusturan","type":"address"},{"internalType":"bytes32","name":"sifreHash","type":"bytes32"},{"internalType":"uint256","name":"miktar","type":"uint256"},{"internalType":"bool","name":"alindi","type":"bool"}],"stateMutability":"view","type":"function"},{"inputs":[],"name":"hediyeSayaci","outputs":[{"internalType":"uint256","name":"","type":"uint256"}],"stateMutability":"view","type":"function"}];
        const projectId = '76e26710777553f17377f0a927a445d4';

        let signer, contract, modal;

        // Modal açma fonksiyonunu global yapıyoruz
        window.openWalletModal = async () => {
            if (!modal) {
                alert("Sistem yükleniyor, lütfen tekrar deneyin.");
                return;
            }
            modal.open();
        };

        function initializeApp() {
            const lib = window.Web3ModalEthers;
            if (!lib) {
                setTimeout(initializeApp, 200);
                return;
            }

            const { createWeb3Modal, defaultConfig } = lib;
            modal = createWeb3Modal({
                ethersConfig: defaultConfig({ metadata: { name: 'BaseGift', url: window.location.origin } }),
                chains: [{
                    chainId: 84532,
                    name: 'Base Sepolia',
                    currency: 'ETH',
                    explorerUrl: 'https://sepolia.basescan.org',
                    rpcUrl: 'https://sepolia.base.org'
                }],
                projectId,
                themeMode: 'dark'
            });

            // Bağlantı durumunu dinle
            modal.subscribeProvider(({ provider: wp, isConnected }) => {
                if (isConnected && wp) setupConnection(wp);
            });
        }

        async function setupConnection(wp) {
            const provider = new ethers.BrowserProvider(wp);
            signer = await provider.getSigner();
            contract = new ethers.Contract(contractAddress, abi, signer);
            const addr = await signer.getAddress();
            document.getElementById('mainConnectBtn').innerText = addr.slice(0,6) + "..." + addr.slice(-4);
            document.getElementById('statusLabel').innerText = "Cüzdan Bağlı.";
        }

        window.createGift = async () => {
            try {
                if (!signer) return modal.open();
                const amt = document.getElementById('amount').value;
                const pass = document.getElementById('createPass').value;
                const hash = ethers.keccak256(ethers.toUtf8Bytes(pass));
                const tx = await contract.hediyeOlustur(hash, { value: ethers.parseEther(amt) });
                document.getElementById('statusLabel').innerText = "Onay bekleniyor...";
                await tx.wait();
                document.getElementById('statusLabel').innerText = "İşlem Başarılı! ✅";
            } catch (e) { console.error(e); }
        };

        window.claimGift = async () => {
            try {
                if (!signer) return modal.open();
                const id = document.getElementById('giftId').value;
                const pass = document.getElementById('claimPass').value;
                const tx = await contract.hediyeAl(BigInt(id), pass);
                await tx.wait();
                document.getElementById('statusLabel').innerText = "Hediye Alındı! 🎁";
            } catch (e) { alert("Hata oluştu."); }
        };

        window.onload = initializeApp;
    </script>
</body>
</html>
