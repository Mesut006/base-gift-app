<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base Gift V2</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-600 text-white p-8 font-sans">
    <div class="max-w-md mx-auto bg-white/10 p-6 rounded-2xl backdrop-blur-md border border-white/20">
        <h1 class="text-3xl font-bold text-center mb-8">🎁 Base Hediye V2</h1>
        
        <button id="connectBtn" class="w-full bg-white text-blue-600 py-3 rounded-xl font-bold mb-6">Cüzdanı Bağla</button>

        <div class="space-y-4">
            <div class="bg-black/20 p-4 rounded-xl">
                <h2 class="font-bold mb-2">Hediye Oluştur</h2>
                <input id="amount" type="number" placeholder="ETH Miktarı" class="w-full p-2 bg-transparent border-b outline-none mb-2">
                <input id="createPass" type="password" placeholder="Şifre Belirle" class="w-full p-2 bg-transparent border-b outline-none mb-4">
                <button onclick="createGift()" class="w-full bg-green-500 py-2 rounded-lg font-bold">Paketle ve Gönder</button>
            </div>

            <div class="bg-black/20 p-4 rounded-xl">
                <h2 class="font-bold mb-2">Hediye Al</h2>
                <input id="giftId" type="number" placeholder="Hediye ID" class="w-full p-2 bg-transparent border-b outline-none mb-2">
                <input id="claimPass" type="password" placeholder="Şifreyi Gir" class="w-full p-2 bg-transparent border-b outline-none mb-4">
                <button onclick="claimGift()" class="w-full bg-white/20 py-2 rounded-lg font-bold">Cüzdana Çek</button>
            </div>
        </div>
        <p id="status" class="mt-4 text-center text-sm font-mono bg-black/30 p-2 rounded hidden"></p>
    </div>

 <script>
        // 0x2ff7991F6a895813D687a31e54D79c329CC4B8F7
        const contractAddress = "0x2ff7991F6a895813D687a31e54D79c329CC4B8F7"; 
        
        const abi = [
    "function hediyeOlustur(bytes32 _sifreHash) public payable",
    "function hediyeAl(uint256 _id, string _sifre) public", // memory kelimesini sildik, ethers otomatik anlar
    "function hediyeSayaci() public view returns (uint256)"
];

        let signer;
        let contract;

        // Cüzdan bağlama butonu
        document.getElementById('connectBtn').onclick = async () => {
            if (typeof window.ethereum !== 'undefined') {
                try {
                    const provider = new ethers.BrowserProvider(window.ethereum);
                    await provider.send("eth_requestAccounts", []);
                    signer = await provider.getSigner();
                    contract = new ethers.Contract(contractAddress, abi, signer);
                    document.getElementById('connectBtn').innerText = "Bağlandı ✅";
                    showStatus("Cüzdan bağlandı, işlem yapabilirsiniz.");
                } catch (err) {
                    showStatus("Bağlantı hatası: " + err.message);
                }
            } else {
                alert("Lütfen MetaMask yükleyin!");
            }
        };

        async function createGift() {
            try {
                const amt = document.getElementById('amount').value;
                const pass = document.getElementById('createPass').value;
                
                if (!signer) return showStatus("Hata: Önce cüzdanı bağlayın!");
                if (!amt || amt <= 0) return showStatus("Hata: Geçerli bir miktar girin!");

                const hash = ethers.keccak256(ethers.toUtf8Bytes(pass));
                showStatus("MetaMask onayı bekleniyor...");
                
                // Gas limitini otomatik hesaplaması için bırakıyoruz ama hata verirse manuel ekleriz
                const tx = await contract.hediyeOlustur(hash, { 
                    value: ethers.parseEther(amt) 
                });

                showStatus("İşlem ağa gönderildi. Onaylanıyor...");
                await tx.wait();
                
                const count = await contract.hediyeSayaci();
                showStatus(`🎁 BAŞARILI! Hediye ID: ${Number(count) - 1}. Şifreniz: ${pass}`);
            } catch (e) { 
                console.error("Detaylı Hata:", e);
                const errorMsg = e.reason || e.message || "Bilinmeyen Hata";
                showStatus("Hata: " + errorMsg); 
            }
        }

        async function claimGift() {
    try {
        const id = document.getElementById('giftId').value;
        const pass = document.getElementById('claimPass').value;
        
        if (!signer) return showStatus("Hata: Önce cüzdanı bağlayın!");
        if (id === "" || !pass) return showStatus("Hata: ID ve Şifre girmelisiniz!");

        showStatus("Kontratla iletişim kuruluyor...");

        // KRİTİK DÜZELTME: İşlemi daha detaylı hata yakalayacak şekilde çağırıyoruz
        const tx = await contract.hediyeAl(BigInt(id), pass.trim()); 
        
        showStatus("Onay bekleniyor... Lütfen MetaMask'ı kontrol edin.");
        await tx.wait();
        
        showStatus("✅ BAŞARILI! Para cüzdanınıza aktarıldı.");
    } catch (e) { 
        console.error("Claim Hatası:", e);
        // Hatanın sebebini kullanıcıya net göster
        let mesaj = "Şifre yanlış veya hediye zaten alınmış olabilir.";
        if (e.reason) mesaj = "Hata Nedeni: " + e.reason;
        showStatus("Hata: " + mesaj); 
    }
}
        function showStatus(msg) {
            const s = document.getElementById('status');
            s.innerText = msg;
            s.classList.remove('hidden');
        }
    </script>
</body>
</html>
