<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BaseGift | On-Chain Hediye</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@web3modal/ethers@5.1.5/dist/index.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        body { font-family: sans-serif; background: #0a0a0a; color: white; min-height: 100vh; margin: 0; padding: 20px; }
        .card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 20px; border-radius: 20px; }
        input { background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); color: white; padding: 10px; border-radius: 10px; width: 100%; margin-bottom: 10px; }
        button { cursor: pointer; transition: 0.3s; }
        button:hover { opacity: 0.8; }
    </style>
</head>
<body>

    <div style="max-width: 600px; margin: 0 auto;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px;">
            <h1 style="font-weight: 800; font-style: italic;">BASEGIFT</h1>
            <button id="connectBtn" style="background: #0052ff; border: none; color: white; padding: 10px 20px; border-radius: 50px; font-weight: bold;">Cüzdanı Bağla</button>
        </div>

        <div class="card" style="margin-bottom: 20px;">
            <h3>Hediye Gönder 🎁</h3>
            <input id="amount" type="number" placeholder="Miktar (ETH)">
            <input id="createPass" type="password" placeholder="Şifre">
            <button onclick="createGift()" style="width: 100%; background: #22c55e; border: none; color: white; padding: 15px; border-radius: 10px; font-weight: bold;">Mühürle ve Gönder</button>
        </div>

        <div class="card">
            <h3>Hediye Al 🔑</h3>
            <input id="giftId" type="number" placeholder="Hediye ID">
            <input id="claimPass" type="password" placeholder="Şifreyi Gir">
            <button onclick="claimGift()" style="width: 100%; background: #3b82f6; border: none; color: white; padding: 15px; border-radius: 10px; font-weight: bold;">Hediyeyi Çek</button>
        </div>

        <div id="status" style="margin-top: 20px; text-align: center; color: #60a5fa; font-size: 14px;"></div>
    </div>

    <script>
        const contractAddress = "0x40528Fa18B169724789D756218cE0652018ada33";
        const abi = [{"inputs":[{"internalType":"bytes32","name":"_sifreHash","type":"bytes32"}],"name":"hediyeOlustur","outputs":[],"stateMutability":"payable","type":"function"},{"inputs":[{"internalType":"uint256","name":"_id","type":"uint256"},{"internalType":"string","name":"_sifre","type":"string"}],"name":"hediyeAl","outputs":[],"stateMutability":"nonpayable","type":"function"},{"inputs":[{"internalType":"address","name":"_olusturan","type":"address"}],"name":"kullaniciHediyeleri","outputs":[{"internalType":"uint256[]","name":"","type":"uint256[]"}],"stateMutability":"view","type":"function"},{"inputs":[{"internalType":"uint256","name":"","type":"uint256"}],"name":"hediyeler","outputs":[{"internalType":"address","name":"olusturan","type":"address"},{"internalType":"bytes32","name":"sifreHash","type":"bytes32"},{"internalType":"uint256","name":"miktar","type":"uint256"},{"internalType":"bool","name":"alindi","type":"bool"}],"stateMutability":"view","type":"function"},{"inputs":[],"name":"hediyeSayaci","outputs":[{"internalType":"uint256","name":"","type":"uint256"}],"stateMutability":"view","type":"function"}];

        // BURAYI KENDI PROJECT ID'NLE DEGISTIR
        const projectId = 'f302bade5f99a4e406c852288174b049'; 

        let signer, contract, modal;

        // Kütüphane yüklenene kadar bekleyen ana fonksiyon
        async function init() {
            if (!window.Web3Modal) {
                setTimeout(init, 500);
                return;
            }

            const { createWeb3Modal, defaultConfig } = window.Web3Modal;
            
            modal = createWeb3Modal({
                ethersConfig: defaultConfig({ metadata: { name: 'BaseGift', url: window.location.origin } }),
                chains: [{
                    chainId: 84532,
                    name: 'Base Sepolia',
                    currency: 'ETH',
                    explorerUrl: 'https://sepolia.basescan.org',
                    rpcUrl: 'https://sepolia.base.org'
                }],
                projectId,
                themeMode: 'dark'
            });

            document.getElementById('connectBtn').onclick = async () => {
                const wp = modal.getWalletProvider();
                if (wp) setup(wp); else modal.open();
            };

            modal.subscribeProvider(({ provider: wp, isConnected }) => {
                if (isConnected && wp) setup(wp);
            });
        }

        async function setup(wp) {
            const provider = new window.Web3Modal.ethers.BrowserProvider(wp);
            signer = await provider.getSigner();
            contract = new window.Web3Modal.ethers.Contract(contractAddress, abi, signer);
            const addr = await signer.getAddress();
            document.getElementById('connectBtn').innerText = addr.slice(0,6) + "..." + addr.slice(-4);
            document.getElementById('status').innerText = "Cüzdan Bağlandı!";
        }

        async function createGift() {
            try {
                const amt = document.getElementById('amount').value;
                const pass = document.getElementById('createPass').value;
                const hash = window.Web3Modal.ethers.keccak256(window.Web3Modal.ethers.toUtf8Bytes(pass));
                const tx = await contract.hediyeOlustur(hash, { value: window.Web3Modal.ethers.parseEther(amt) });
                document.getElementById('status').innerText = "İşlem gönderildi...";
                await tx.wait();
                confetti();
                document.getElementById('status').innerText = "Hediye oluşturuldu!";
            } catch (e) { alert(e.message); }
        }

        async function claimGift() {
            try {
                const id = document.getElementById('giftId').value;
                const pass = document.getElementById('claimPass').value;
                const tx = await contract.hediyeAl(BigInt(id), pass);
                await tx.wait();
                confetti();
                document.getElementById('status').innerText = "Hediye alındı!";
            } catch (e) { alert("Hata: Şifre yanlış olabilir."); }
        }

        window.onload = init;
    </script>
</body>
</html>
